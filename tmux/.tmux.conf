set -g escape-time 10

# Prefix: Ctrl+A (more ergonomic than Ctrl+B)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse support (click panes, scroll, resize)
set -g mouse on

# Increase scrollback buffer
set -g history-limit 10000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Reload config with prefix+r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Split panes with | and - (more intuitive than % and ")
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vi keys for copy mode
setw -g mode-keys vi

# Status bar
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left '#[fg=#89b4fa,bold] [#S] '
set -g status-right "#[fg=#89dceb]ai:#(pgrep -c 'claude|codex|gemini' 2>/dev/null || echo 0)  #[fg=#a6e3a1]%H:%M  #[fg=#cdd6f4]%d %b"
set -g status-left-length 20
set -g status-interval 10
set -g window-status-current-style 'fg=#f38ba8,bold'

# Silence all bells / monitoring — CLIs like Claude emit \a frequently and
# tmux's monitors are too blunt for streaming tools. Explicitly reset all
# so source-file fully clears any previously loaded values on reload.
# (Per-window AI coloring was dropped: window-status-format only sees a
# window's active pane, so it missed Claude running in a background pane.
# The ai:N counter in status-right is process-accurate and covers this.)
set -g bell-action none
set -g visual-bell off
setw -g monitor-activity off
setw -g monitor-silence 0
set -g visual-activity off
set -g visual-silence off

# Auto-label windows by current directory basename (e.g. esa, infra, mee).
# Falls back to the running command when path is unavailable (avoids '-' on
# windows where cwd is briefly unresolvable, e.g. during Claude execution).
# allow-rename off stops programs overriding via escape sequences; a manual
# `prefix ,` rename still wins.
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{b:pane_current_path},#{b:pane_current_path},#{pane_current_command}}'
set-option -g allow-rename off
